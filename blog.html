<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Articles</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#fff;--text:#111;--muted:#767676;--border:#f0f0f0;--accent:#0066cc;
  --code:#f6f8fa
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;padding:80px 20px 50px;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.5;min-height:100vh
}
.container{width:100%;max-width:720px;margin:auto}
.top-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:40px;border-bottom:1px solid var(--border);padding-bottom:20px
}
.header-left{display:flex;align-items:center;gap:16px}
.home-title{font-size:1.1rem;font-weight:500;margin:0;cursor:pointer}
.theme-toggle,.back-btn,.pagination button,.load-more-btn{
  background:none;border:1px solid var(--border);color:var(--muted);
  font:inherit;font-size:.78rem;padding:5px 10px;cursor:pointer;border-radius:4px
}
.theme-toggle:hover,.back-btn:hover,.pagination button:hover,.load-more-btn:hover{
  color:var(--text);border-color:var(--muted)
}
.profile-container{position:relative;width:56px;height:56px;flex-shrink:0}
.avatar-wrapper{width:100%;height:100%;border-radius:50%;overflow:hidden}
.avatar-img{width:100%;height:100%;object-fit:cover;display:block}
.status-badge{
  position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;
  background:#10b981;box-shadow:0 0 0 2px var(--bg)
}
.page-heading{margin:0 0 8px;font-size:1.4rem;font-weight:400}
.page-subtitle{margin:0 0 28px;color:var(--muted);font-size:.85rem}
.search-wrap{position:relative;margin-bottom:28px}
.search-wrap i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.8rem}
#article-search{
  width:100%;padding:11px 40px;border:1px solid var(--border);border-radius:6px;
  outline:none;background:#fafafa;color:var(--text);font:inherit;font-size:.9rem
}
.clear-search{
  display:none;position:absolute;right:12px;top:50%;transform:translateY(-50%);
  border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem
}
.results-meta{font-size:.78rem;color:var(--muted);margin-bottom:24px}
.article-item{
  display:flex;gap:24px;margin-bottom:40px;align-items:flex-start;cursor:pointer
}
.article-item-content{display:flex;gap:24px;flex:1;min-width:0}
.thumbnail{
  width:80px;height:60px;object-fit:cover;flex-shrink:0;background:#f7f7f7;border-radius:2px
}
.article-details{min-width:0}
.article-details h2{
  margin:0 0 4px;font-size:1rem;font-weight:400;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis
}
.date,.author{font-size:.78rem;color:var(--muted)}
.author{margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:.7rem;color:var(--muted);background:rgba(128,128,128,.1);padding:3px 8px;border-radius:2px}
.empty-state{text-align:center;padding:45px 0;color:var(--muted);font-size:.85rem}
.load-more-container{text-align:center;margin:10px 0 38px}
.pagination{
  border-top:1px solid var(--border);padding-top:22px;margin-top:8px;
  display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap
}
.pagination button{min-width:34px;height:34px;padding:0}
.pagination button.active{background:var(--text);border-color:var(--text);color:var(--bg)}
.pagination button:disabled{opacity:.35;cursor:not-allowed}
.pagination-label{font-size:.78rem;color:var(--muted);margin:0 8px}

#article-view{display:none}
.article-view-header{margin-bottom:30px}
.single-title{font-size:1.5rem;font-weight:400;margin:0 0 8px}
.single-meta{font-size:.82rem;color:var(--muted);margin-bottom:28px}
.article-cover{
  width:100%;max-height:420px;object-fit:cover;border-radius:4px;margin-bottom:30px
}
.single-content{font-size:1rem;margin-bottom:30px}
.single-content h1,.single-content h2,.single-content h3,.single-content h4{
  font-weight:500;margin-top:38px;margin-bottom:14px
}
.single-content p{margin:0 0 20px;line-height:1.7}
.single-content img{max-width:100%;height:auto;border-radius:5px}
.single-content ul,.single-content ol{padding-left:24px;margin-bottom:24px}
.single-content li{margin-bottom:8px}
.article-code-wrapper{
  background:var(--code);border:1px solid var(--border);border-radius:6px;
  padding:16px;margin:24px 0;overflow:auto;font-family:monospace
}
.article-table-wrapper{overflow-x:auto;margin:24px 0}
.article-table{width:100%;border-collapse:collapse;font-size:.9rem}
.article-table th,.article-table td{padding:10px 14px;border-bottom:1px solid var(--border);text-align:left}
.resources-section{margin-top:40px;border-top:1px solid var(--border);padding-top:20px}
.resources-title{
  font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:12px
}
.resources-list{list-style:none;padding:0;margin:0 0 24px;display:flex;flex-direction:column;gap:10px}
.resources-list a,.media-btn{
  color:var(--text);text-decoration:underline;text-underline-offset:3px;
  background:none;border:0;padding:0;font:inherit;font-size:.9rem;cursor:pointer;text-align:left
}
.media-btn:hover,.resources-list a:hover{color:var(--accent)}
.media-preview{
  display:none;margin:24px 0;padding:16px;border:1px solid var(--border);border-radius:6px
}
.media-preview-title{font-size:.78rem;color:var(--muted);margin-bottom:12px;font-weight:600}
.media-video{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;background:#000;border-radius:4px}
.media-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.media-audio audio{width:100%}
.article-tags{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}
.article-bottom{
  display:flex;justify-content:space-between;border-top:1px solid var(--border);
  padding-top:20px;margin-top:30px
}
.post-navigation{
  display:flex;justify-content:space-between;border-top:1px solid var(--border);
  padding-top:24px;margin:40px 0
}
.post-navigation button{background:none;border:0;color:var(--text);cursor:pointer}
.post-navigation button:disabled{color:#bbb;cursor:not-allowed}
.loader{
  position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
  justify-content:center;z-index:9999;transition:.25s
}
.chat-loader{display:flex;gap:4px}
.chat-loader span{width:5px;height:5px;background:var(--text);border-radius:50%;animation:wave 1.3s infinite ease-in-out}
.chat-loader span:nth-child(2){animation-delay:-1.1s}.chat-loader span:nth-child(3){animation-delay:-.9s}
@keyframes wave{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
@media(max-width:600px){
  body{padding:35px 16px 35px}.top-header{margin-bottom:30px}
  .profile-container{width:46px;height:46px}.article-item{gap:12px;margin-bottom:30px}
  .article-item-content{gap:14px}.thumbnail{width:68px;height:52px}
  .article-details h2{white-space:normal}.single-title{font-size:1.3rem}
}
</style>
</head>
<body>
<div class="loader" id="loader"><div class="chat-loader"><span></span><span></span><span></span></div></div>

<div class="container">
<header class="top-header">
  <div class="header-left">
    <h1 class="home-title" onclick="showList()">All Articles</h1>
    <button class="theme-toggle" onclick="toggleTheme()">Theme</button>
  </div>
  <div class="profile-container">
    <div class="avatar-wrapper">
      <img class="avatar-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Profile">
    </div>
    <div class="status-badge"></div>
  </div>
</header>

<main id="list-view">
  <h2 class="page-heading">Articles</h2>
  <p class="page-subtitle">Discover articles published by everyone.</p>

  <div class="search-wrap">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input id="article-search" type="search" placeholder="Search articles or tags..." autocomplete="off">
    <button class="clear-search" id="clear-search">&times;</button>
  </div>

  <div class="results-meta" id="results-meta"></div>
  <section id="article-list" aria-live="polite"></section>

  <div class="load-more-container" id="load-more-container">
    <button class="load-more-btn" onclick="loadMoreArticles()">Show more</button>
  </div>
  <nav class="pagination" id="pagination"></nav>
</main>

<main id="article-view">
  <div class="article-view-header">
    <button class="back-btn" onclick="showList()">← All Articles</button>
  </div>
  <h1 class="single-title" id="view-title"></h1>
  <div class="single-meta" id="view-meta"></div>
  <img id="view-cover" class="article-cover" style="display:none" alt="">
  <div class="single-content" id="view-content"></div>

  <div class="resources-section" id="resources-section" style="display:none">
    <div id="videos-container" style="display:none">
      <div class="resources-title">Video Links</div>
      <ul class="resources-list" id="videos-list"></ul>
    </div>
    <div id="audio-container" style="display:none">
      <div class="resources-title">Audio Links</div>
      <ul class="resources-list" id="audio-list"></ul>
    </div>
    <div class="media-preview" id="media-preview">
      <div class="media-preview-title" id="media-preview-title">Now Playing</div>
      <div id="media-player"></div>
    </div>
    <div id="links-container" style="display:none">
      <div class="resources-title">Links</div>
      <ul class="resources-list" id="links-list"></ul>
    </div>
    <div id="downloads-container" style="display:none">
      <div class="resources-title">Download Resources</div>
      <ul class="resources-list" id="downloads-list"></ul>
    </div>
  </div>

  <div class="article-tags" id="view-tags"></div>

  <div class="article-bottom">
    <button class="back-btn" onclick="showList()">← Back</button>
    <button class="back-btn" onclick="shareArticle()">Share</button>
  </div>

  <div class="post-navigation">
    <button id="prev-btn" onclick="navigateArticle(-1)">Previous</button>
    <button id="next-btn" onclick="navigateArticle(1)">Next</button>
  </div>
</main>
</div>

<script>
/* ================= SUPABASE CONFIG =================
   Replace these two values with your Supabase project values.
   NEVER use your service_role/secret key in this file.
===================================================== */
const SUPABASE_URL = "https://pabqkagdzfevkjiklrpj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhYnFrYWdkemZldmtqaWtscnBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MDQxMDMsImV4cCI6MjEwNDM4MDEwM30.MVEnwXCdapV0qXS14JvuRBoWggLAnVJjBJStpkST_6g";

const supabaseClient =
  (SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.startsWith("ey") && window.supabase && typeof window.supabase.createClient === "function")
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

const PAGE_SIZE = 10;
const SHOW_MORE_STEP = 3;

let allArticles = [];
let filteredArticles = [];
let currentPage = 1;
let visibleCount = PAGE_SIZE;
let currentArticleId = null;
let isDarkMode = false;

const listView = document.getElementById("list-view");
const articleView = document.getElementById("article-view");
const listEl = document.getElementById("article-list");
const searchEl = document.getElementById("article-search");
const clearBtn = document.getElementById("clear-search");
const resultsMeta = document.getElementById("results-meta");
const paginationEl = document.getElementById("pagination");
const loadMoreContainer = document.getElementById("load-more-container");
const loader = document.getElementById("loader");

function escapeHtml(value=""){
  return String(value).replace(/[&<>"']/g,ch=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[ch]));
}

function safeUrl(value=""){
  try{
    const u = new URL(value, window.location.href);
    if(["http:","https:","mailto:"].includes(u.protocol)) return u.href;
  }catch(e){}
  return "#";
}

function normalizeArticle(row){
  return {
    id: row.id,
    title: row.title || "Untitled article",
    date: row.published_at || row.created_at || "",
    thumbnail: row.thumbnail || "",
    images: Array.isArray(row.images) ? row.images : [],
    content: row.content || "",
    videos: Array.isArray(row.videos) ? row.videos : [],
    audio: Array.isArray(row.audio) ? row.audio : [],
    links: Array.isArray(row.links) ? row.links : [],
    downloads: Array.isArray(row.downloads) ? row.downloads : [],
    tags: Array.isArray(row.tags) ? row.tags : [],
    author: row.author || "Anonymous",
    authorAvatar: row.author_avatar || "",
    userId: row.user_id || ""
  };
}

async function fetchArticles(){
  showLoader(true);

  try{
    if(!supabaseClient){
      throw new Error("Supabase is not configured. Add your project URL and anon/publishable key.");
    }

    const {data,error} = await supabaseClient
      .from("articles")
      .select("*")
      .order("published_at",{ascending:false});

    if(error) throw error;

    allArticles = (data || []).map(normalizeArticle);
    applySearch(false);
  }catch(error){
    console.error(error);
    allArticles = [];
    filteredArticles = [];
    listEl.innerHTML = `<div class="empty-state">${escapeHtml(error.message || "Unable to load articles.")}</div>`;
    resultsMeta.textContent = "";
    paginationEl.innerHTML = "";
    loadMoreContainer.style.display = "none";
  }finally{
    showLoader(false);
  }
}

function applySearch(resetPage=true){
  const term = searchEl.value.trim().toLowerCase();
  clearBtn.style.display = term ? "block" : "none";

  filteredArticles = allArticles.filter(article=>{
    if(!term) return true;
    return [
      article.title,article.author,article.content,
      ...(article.tags || [])
    ].join(" ").toLowerCase().includes(term);
  });

  if(resetPage) currentPage = 1;
  visibleCount = PAGE_SIZE;
  render();
}

function render(){
  const start = (currentPage-1)*PAGE_SIZE;
  const pageArticles = filteredArticles.slice(start,start+PAGE_SIZE);
  const visibleArticles = pageArticles.slice(0,visibleCount);

  resultsMeta.textContent =
    `${filteredArticles.length} article${filteredArticles.length===1?"":"s"}` +
    (searchEl.value.trim() ? ` matching “${searchEl.value.trim()}”` : "");

  if(!visibleArticles.length){
    listEl.innerHTML = `<div class="empty-state">No articles found.</div>`;
  }else{
    listEl.innerHTML = visibleArticles.map(article=>{
      const thumb = article.thumbnail || (article.images && article.images[0]) || "";
      const tags = (article.tags||[]).slice(0,4).map(tag =>
        `<span class="tag">#${escapeHtml(tag)}</span>`).join("");

      return `
        <article class="article-item" onclick="openArticle(${JSON.stringify(String(article.id))})">
          <div class="article-item-content">
            ${thumb ? `<img class="thumbnail" src="${escapeHtml(thumb)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ""}
            <div class="article-details">
              <h2>${escapeHtml(article.title)}</h2>
              <div class="date">${escapeHtml(formatDate(article.date))}</div>
              <div class="author">${escapeHtml(article.author)}</div>
              ${tags ? `<div class="tags">${tags}</div>` : ""}
            </div>
          </div>
        </article>`;
    }).join("");
  }

  loadMoreContainer.style.display =
    visibleCount < pageArticles.length ? "block" : "none";

  renderPagination();
}

function loadMoreArticles(){
  visibleCount += SHOW_MORE_STEP;
  render();
}

function renderPagination(){
  const totalPages = Math.max(1,Math.ceil(filteredArticles.length/PAGE_SIZE));
  if(totalPages<=1){
    paginationEl.innerHTML="";
    return;
  }

  let html = `<button ${currentPage===1?"disabled":""} onclick="goToPage(${currentPage-1})">‹</button>`;

  for(let i=1;i<=totalPages;i++){
    if(totalPages>7 && i>2 && i<totalPages-1 && Math.abs(i-currentPage)>1){
      if(i===3 || i===totalPages-2) html += `<span class="pagination-label">…</span>`;
      continue;
    }
    html += `<button class="${i===currentPage?"active":""}" onclick="goToPage(${i})">${i}</button>`;
  }

  html += `<button ${currentPage===totalPages?"disabled":""} onclick="goToPage(${currentPage+1})">›</button>`;
  paginationEl.innerHTML=html;
}

function goToPage(page){
  const totalPages=Math.max(1,Math.ceil(filteredArticles.length/PAGE_SIZE));
  if(page<1 || page>totalPages) return;
  currentPage=page;
  visibleCount=PAGE_SIZE;
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function openArticle(id){
  try {
    const article = allArticles.find(a=>String(a.id)===String(id));
    if(!article) return;

  currentArticleId = article.id;

  document.getElementById("view-title").textContent = article.title;
  document.getElementById("view-meta").textContent =
    `${formatDate(article.date)}${article.author ? " · " + article.author : ""}`;

  const cover = document.getElementById("view-cover");
  const coverUrl = article.thumbnail || (article.images && article.images[0]) || "";
  if(coverUrl){
    cover.src=coverUrl;
    cover.style.display="block";
  }else{
    cover.style.display="none";
  }

  document.getElementById("view-content").innerHTML = article.content || "";
  renderResources(article);

  const tags = document.getElementById("view-tags");
  tags.innerHTML=(article.tags||[]).map(t=>`<span class="tag">#${escapeHtml(t)}</span>`).join("");

  const index=allArticles.findIndex(a=>String(a.id)===String(article.id));
  document.getElementById("prev-btn").disabled=index<=0;
  document.getElementById("next-btn").disabled=index>=allArticles.length-1;

  listView.style.display="none";
  articleView.style.display="block";
    window.scrollTo({top:0,behavior:"smooth"});
  } catch(error) {
    console.error("Article open failed:", error);
    showLoader(false);
    listView.style.display="block";
    articleView.style.display="none";
    listEl.innerHTML = `<div class="empty-state">Unable to open this article: ${escapeHtml(error.message || "Unknown error")}</div>`;
  }
}

function showList(){
  currentArticleId=null;
  articleView.style.display="none";
  listView.style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderResources(article){
  const ids=["videos-container","audio-container","links-container","downloads-container"];
  ids.forEach(id=>document.getElementById(id).style.display="none");
  document.getElementById("resources-section").style.display="none";
  document.getElementById("media-preview").style.display="none";

  let has=false;

  const videosList=document.getElementById("videos-list");
  videosList.innerHTML="";
  (article.videos||[]).forEach((v,i)=>{
    const li=document.createElement("li");
    const b=document.createElement("button");
    b.className="media-btn";
    b.textContent="▶ "+(v.title||"Video");
    b.onclick=()=>playMedia("video",v.url||"",v.title||"Video");
    li.appendChild(b);videosList.appendChild(li);has=true;
  });
  if((article.videos||[]).length) document.getElementById("videos-container").style.display="block";

  const audioList=document.getElementById("audio-list");
  audioList.innerHTML="";
  (article.audio||[]).forEach(a=>{
    const li=document.createElement("li");
    const b=document.createElement("button");
    b.className="media-btn";
    b.textContent="🎵 "+(a.title||"Audio");
    b.onclick=()=>playMedia("audio",a.url||"",a.title||"Audio");
    li.appendChild(b);audioList.appendChild(li);has=true;
  });
  if((article.audio||[]).length) document.getElementById("audio-container").style.display="block";

  const linksList=document.getElementById("links-list");
  linksList.innerHTML="";
  (article.links||[]).forEach(l=>{
    const li=document.createElement("li");
    li.innerHTML=`<a href="${escapeHtml(safeUrl(l.url||""))}" target="_blank" rel="noopener noreferrer">${escapeHtml(l.label||l.title||l.url||"Link")}</a>`;
    linksList.appendChild(li);has=true;
  });
  if((article.links||[]).length) document.getElementById("links-container").style.display="block";

  const downloadsList=document.getElementById("downloads-list");
  downloadsList.innerHTML="";
  (article.downloads||[]).forEach(d=>{
    const li=document.createElement("li");
    li.innerHTML=`<a href="${escapeHtml(safeUrl(d.url||""))}" target="_blank" rel="noopener noreferrer" download>${escapeHtml(d.label||d.title||"Download")}</a>`;
    downloadsList.appendChild(li);has=true;
  });
  if((article.downloads||[]).length) document.getElementById("downloads-container").style.display="block";

  document.getElementById("resources-section").style.display=has?"block":"none";
}

function getYouTubeEmbedUrl(url){
  try{
    const u=new URL(url);
    if(u.hostname.includes("youtu.be")) return "https://www.youtube-nocookie.com/embed/"+u.pathname.slice(1);
    if(u.hostname.includes("youtube.com") && u.searchParams.get("v"))
      return "https://www.youtube-nocookie.com/embed/"+u.searchParams.get("v");
    if(u.pathname.includes("/embed/")) return url;
  }catch(e){}
  return url;
}

function playMedia(type,url,title){
  const preview=document.getElementById("media-preview");
  const player=document.getElementById("media-player");
  document.getElementById("media-preview-title").textContent="Now Playing: "+title;
  preview.style.display="block";

  if(type==="video"){
    const embed=getYouTubeEmbedUrl(url);
    player.innerHTML=`<div class="media-video"><iframe src="${escapeHtml(embed)}" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>`;
  }else{
    player.innerHTML=`<div class="media-audio"><audio controls autoplay><source src="${escapeHtml(safeUrl(url))}"></audio></div>`;
  }
  preview.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function navigateArticle(direction){
  const index=allArticles.findIndex(a=>String(a.id)===String(currentArticleId));
  const next=allArticles[index+direction];
  if(next) openArticle(next.id);
}

async function shareArticle(){
  const article=allArticles.find(a=>String(a.id)===String(currentArticleId));
  if(!article) return;

  const url=window.location.href;
  if(navigator.share){
    try{await navigator.share({title:article.title,url});return;}catch(e){}
  }
  try{
    await navigator.clipboard.writeText(url);
    alert("Article link copied.");
  }catch(e){
    prompt("Copy this article link:",url);
  }
}

function formatDate(value){
  if(!value) return "";
  const d=new Date(value);
  if(Number.isNaN(d.getTime())) return value;
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
}

function toggleTheme(){
  isDarkMode=!isDarkMode;
  const root=document.documentElement;

  if(isDarkMode){
    root.style.setProperty("--bg","#121212");
    root.style.setProperty("--text","#f5f5f5");
    root.style.setProperty("--muted","#a3a3a3");
    root.style.setProperty("--border","#292929");
    root.style.setProperty("--code","#1e1e1e");
  }else{
    root.style.setProperty("--bg","#fff");
    root.style.setProperty("--text","#111");
    root.style.setProperty("--muted","#767676");
    root.style.setProperty("--border","#f0f0f0");
    root.style.setProperty("--code","#f6f8fa");
  }
}

function showLoader(show){
  loader.style.opacity=show?"1":"0";
  loader.style.pointerEvents=show?"auto":"none";
  if(!show) setTimeout(()=>loader.style.display="none",250);
  else loader.style.display="flex";
}

searchEl.addEventListener("input",()=>applySearch(true));
clearBtn.addEventListener("click",()=>{
  searchEl.value="";
  applySearch(true);
  searchEl.focus();
});

window.addEventListener("DOMContentLoaded",fetchArticles);
window.addEventListener("focus",fetchArticles);
</script>
</body>
</html>
